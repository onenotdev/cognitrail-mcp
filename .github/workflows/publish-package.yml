name: Publish GitHub Package

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@onenotdev'
      - name: Prepare scoped distribution metadata
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.name='@onenotdev/cognitrail'; p.publishConfig={registry:'https://npm.pkg.github.com'}; fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"
      - name: Publish protected runtime
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
